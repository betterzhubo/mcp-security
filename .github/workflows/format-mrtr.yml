name: Format MRTR changes

on:
  push:
    branches:
      - feature/mrtr-spring-security-principal-binding
    paths:
      - '.github/workflows/format-mrtr.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mrtr-spring-security-principal-binding
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Apply project formatter
        run: mvn --batch-mode --no-transfer-progress -pl mcp-server-security spring-javaformat:apply
      - name: Commit formatted Java sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp-server-security/src/main/java/org/springaicommunity/mcp/security/server/config/McpRequestStateCodecs.java
          git add mcp-server-security/src/test/java/io/modelcontextprotocol/modern/server/McpRequestStateCodecsTests.java
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Spring Java Format"
            git push origin HEAD:feature/mrtr-spring-security-principal-binding
          fi
