name: Publish Snapshot

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build and publish Snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Check Maven project version
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse("pom.xml").getroot()
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          group_id = root.findtext("m:groupId", namespaces=ns)
          version = root.findtext("m:version", namespaces=ns)

          if not group_id or not version:
              raise SystemExit("Root POM must declare groupId and version")

          should_publish = version.upper().endswith("-SNAPSHOT")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_publish={'true' if should_publish else 'false'}\\n")

          if should_publish:
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                  env.write(f"SNAPSHOT_GROUP_ID={group_id}\\n")
                  env.write(f"SNAPSHOT_VERSION={version}\\n")
              print(f"Snapshot version detected: {group_id}:{version}")
          else:
              print(f"Skipping Snapshot deployment for release version: {version}")
          PY

      - name: Set up JDK 17
        if: steps.snapshot.outputs.should_publish == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Generate Java docs
        if: steps.snapshot.outputs.should_publish == 'true'
        run: mvn -Pjavadoc -B javadoc:aggregate

      - name: Build with Maven and deploy to Sonatype snapshot repository
        if: steps.snapshot.outputs.should_publish == 'true'
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          mvn -Pjavadoc -Prelease --batch-mode --update-snapshots deploy

      - name: Verify Sonatype Snapshot metadata and artifacts
        if: steps.snapshot.outputs.should_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail

          group_path="$(echo "$SNAPSHOT_GROUP_ID" | tr '.' '/')"
          base_url="https://central.sonatype.com/repository/maven-snapshots/${group_path}/mcp-server-security/${SNAPSHOT_VERSION}"
          metadata_url="${base_url}/maven-metadata.xml"
          metadata_file="${RUNNER_TEMP}/maven-metadata.xml"

          for attempt in $(seq 1 18); do
            if curl --fail --location --silent --show-error "${metadata_url}" --output "${metadata_file}"; then
              break
            fi
            echo "Snapshot metadata not visible yet (attempt ${attempt}/18)"
            if [ "${attempt}" -eq 18 ]; then
              echo "Snapshot metadata was not available after 3 minutes"
              exit 1
            fi
            sleep 10
          done

          snapshot_version="$(python3 - "${metadata_file}" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          versions = root.findall("./versioning/snapshotVersions/snapshotVersion")
          for item in versions:
              extension = item.findtext("extension")
              classifier = item.findtext("classifier")
              value = item.findtext("value")
              if extension == "jar" and not classifier and value:
                  print(value)
                  break
          else:
              raise SystemExit("No timestamped JAR version found in maven-metadata.xml")
          PY
          )"

          echo "Resolved Snapshot version: ${snapshot_version}"
          artifact_base="${base_url}/mcp-server-security-${snapshot_version}"

          for extension in jar pom; do
            artifact_url="${artifact_base}.${extension}"
            echo "Verifying ${artifact_url}"
            curl --fail --location --silent --show-error --retry 6 --retry-delay 5 --output /dev/null "${artifact_url}"
          done

          echo "Sonatype Snapshot metadata, JAR, and POM are externally downloadable."
