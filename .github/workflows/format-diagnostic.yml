name: Temporary Java Format Diagnostic

on:
  push:
    branches: [ "feature/mcp-tool-audit-logging" ]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Apply formatter and print exact changes
        run: |
          mvn --batch-mode --no-transfer-progress -pl mcp-server-security spring-javaformat:apply
          git diff -- mcp-server-security/src/main/java mcp-server-security/src/test/java
