name: Temporary Java Format Diagnostic

on:
  push:
    branches:
      - feature/mcp-resource-authorization

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Apply project formatter and show diff
        run: |
          mvn --batch-mode --no-transfer-progress -pl mcp-server-security spring-javaformat:apply
          git diff -- mcp-server-security/src
