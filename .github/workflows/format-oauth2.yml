name: Format OAuth2 change

on:
  workflow_dispatch:
  push:
    branches:
      - feature/oauth2-sync-principal-resolver

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/oauth2-sync-principal-resolver
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Apply project formatter
        run: mvn --batch-mode --no-transfer-progress -pl mcp-client-security spring-javaformat:apply
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp-client-security/src/main/java/org/springaicommunity/mcp/security/client/sync/oauth2/http/client/OAuth2AuthorizationCodeSyncHttpRequestCustomizer.java
          git commit -m "style: apply Spring Java Format"
          git push origin HEAD:feature/oauth2-sync-principal-resolver
