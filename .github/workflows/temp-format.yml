name: Temporary Java Format Inspection

on:
  push:
    branches:
      - feature/oauth2-resource-properties

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Apply formatter and show diff
        run: |
          mvn --batch-mode --no-transfer-progress -pl mcp-client-security-spring-boot spring-javaformat:apply
          git diff -- mcp-client-security-spring-boot/src/main/java/org/springaicommunity/mcp/security/client/boot/McpOAuth2ClientProperties.java mcp-client-security-spring-boot/src/main/java/org/springaicommunity/mcp/security/client/boot/McpOAuth2ClientConfigurations.java
