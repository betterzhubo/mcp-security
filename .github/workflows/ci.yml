name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn --version

      - name: Apply Java formatter for diagnostics
        run: |
          mvn --batch-mode --no-transfer-progress spring-javaformat:apply
          git diff -- mcp-server-security/src/test/java/org/springaicommunity/mcp/security/server/apikey/audit/ApiKeyAuditLoggerTests.java
