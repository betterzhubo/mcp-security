name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn --version

      - name: Apply Spring Java Format on feature branches
        if: startsWith(github.head_ref || github.ref_name, 'feature/')
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          mvn --batch-mode --no-transfer-progress spring-javaformat:apply

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.java'
            git commit -m "Apply Spring Java Format"
            git push origin "HEAD:${BRANCH_NAME}"

            # GITHUB_TOKEN pushes do not trigger push workflows; dispatch CI for the updated branch.
            gh workflow run ci.yml --ref "${BRANCH_NAME}"
            echo "Formatting changes were committed. A fresh CI run has been dispatched for ${BRANCH_NAME}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress clean verify
