spring.application.name=sample-mcp-server-streamable-http-secured-tools
server.port=8091
server.servlet.session.cookie.name=MCP_SERVER_STREAMABLE_HTTP_SECURED_TOOLS_SESSIONID
spring.ai.mcp.server.name=mcp-server-weather-streamable-http-secured-tools
spring.ai.mcp.server.protocol=STREAMABLE

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000

# Comma-separated browser origins allowed to call this MCP server.
# Override with MCP_CORS_ALLOWED_ORIGINS in non-local environments.
mcp.security.cors.allowed-origin-patterns=${MCP_CORS_ALLOWED_ORIGINS:http://localhost:6274}

logging.level.org.springframework.security=INFO
